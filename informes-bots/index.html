<script>
  // genera dígitos 0/1 pseudo-aleatorios cubriendo exactamente el viewport, sin cortes
  const el = document.getElementById('bits');
  const CHAR_W = 12.4;  // avance aproximado por carácter (glifo + letter-spacing) a 13px
  const LINE_H = 24.7;  // alto de línea aproximado a font-size:13px, line-height:1.9

  function paintBits() {
    const cols = Math.ceil(window.innerWidth / CHAR_W) + 4;
    const rows = Math.ceil(window.innerHeight / LINE_H) + 2;
    let out = '';
    for (let r = 0; r < rows; r++) {
      let row = '';
      for (let c = 0; c < cols; c++) row += Math.random() > 0.5 ? '1' : '0';
      out += row + '\n';
    }
    el.textContent = out;
  }

  paintBits();
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintBits, 150);
  });
</script>
